{% extends "base.html" %}
{% block title %}Sign up | Python AI Teaching Assistant{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="eyebrow">START LEARNING</div>
  <h1>Create your account</h1>
  <p class="muted">Your existing Supabase users table will be used.</p>
  <form method="post" class="form">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password (at least 8 characters)</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
    <button class="button" type="submit">Create account</button>
  </form>
  <p class="switch-link">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
