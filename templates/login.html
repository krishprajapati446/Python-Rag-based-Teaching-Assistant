{% extends "base.html" %}
{% block title %}Login | Python AI Teaching Assistant{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="eyebrow">YOUR PYTHON LEARNING SPACE</div>
  <h1>Welcome back 👋</h1>
  <p class="muted">Log in to continue learning with your course assistant.</p>
  <form method="post" class="form">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button" type="submit">Log in</button>
  </form>
  <p class="switch-link">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</section>
{% endblock %}
